name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      runtime_tag:
        type: string
        default: v0.28.0

concurrency:
  group: ci-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  vscode:
    name: VSIX (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          - os: macos
            runner: macos-latest
          - os: windows
            runner: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          allow-prereleases: true
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test units and manifest
        run: npm test -- src/__tests__
      - name: Test license packaging
        run: npm run test:packaging
      - name: Build bundles
        run: npm run build
      - name: Package universal VSIX
        run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: icode-vscode-plugin-${{ matrix.os }}
          path: icode-vscode-plugin-*.vsix
          retention-days: 7

  runtime-compatibility:
    name: Public iCode ACP compatibility
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Download pinned public release (CI only)
        env:
          GH_TOKEN: ${{ github.token }}
          ICODE_RELEASE_TAG: ${{ inputs.runtime_tag || 'v0.28.0' }}
        run: |
          mkdir -p runtime-download runtime-extracted
          [[ "$ICODE_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release download "$ICODE_RELEASE_TAG" --repo openJiuwen-ai/iCode --pattern "icode-linux-x86_64-$ICODE_RELEASE_TAG-offline.tar.gz" --pattern SHA256SUMS.txt --dir runtime-download
          cd runtime-download
          grep -F "  icode-linux-x86_64-$ICODE_RELEASE_TAG-offline.tar.gz" SHA256SUMS.txt > selected.sha256
          test -s selected.sha256
          sha256sum --check selected.sha256
          tar -xzf "icode-linux-x86_64-$ICODE_RELEASE_TAG-offline.tar.gz" -C ../runtime-extracted
      - name: ACP integration with the public binary
        env:
          ICODE_RELEASE_TAG: ${{ inputs.runtime_tag || 'v0.28.0' }}
        run: |
          binary="$(find "$PWD/runtime-extracted" -type f -name icode -print -quit)"
          test -n "$binary"
          chmod +x "$binary"
          ICODE_EXPECTED_VERSION="${ICODE_RELEASE_TAG#v}" ICODE_BINARY_PATH="$binary" npm run test:integration
