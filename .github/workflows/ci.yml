name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  vscode:
    name: VSIX (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          - os: macos
            runner: macos-latest
          - os: windows
            runner: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          allow-prereleases: true
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test units and manifest
        run: npm test -- src/__tests__
      - name: Build bundles
        run: npm run build
      - name: Package universal VSIX
        run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: icode-vscode-plugin-${{ matrix.os }}
          path: icode-vscode-plugin-*.vsix
          retention-days: 7
